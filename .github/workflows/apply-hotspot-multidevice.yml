name: Apply hotspot multi-device packages

on:
  push:
    branches:
      - agent/hotspot-multidevice-packages
    paths:
      - .github/workflows/apply-hotspot-multidevice.yml

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotspot-multidevice-packages
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/apply-hotspot-multidevice.py

      - name: Check backend syntax
        run: |
          node --check backend/src/services/hotspotPlanSchema.js
          node --check backend/src/services/hotspotPayments.js
          node --check backend/src/routes/billingWorkspace.js
          node --check backend/src/routes/hotspotPortal.js
          node --check backend/src/db/init.js

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "Telenexus Admin"
          git config user.email "admin@telenexustechnologies.com"
          git add backend/src/db/init.js backend/src/routes/billingWorkspace.js backend/src/routes/hotspotPortal.js backend/src/services/hotspotPayments.js backend/src/services/hotspotPlanSchema.js frontend/src/components/HotspotControlCenter.jsx frontend/src/pages/HotspotPortal.jsx
          git commit -m "Add multi-device hotspot packages and voucher SMS"
          git push origin HEAD:agent/hotspot-multidevice-packages
