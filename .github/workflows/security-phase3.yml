name: Phase 3 security assurance

on:
  push:
    branches: [production-sync-2026-08-04]
  pull_request:
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-auth-gates:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexa_billing
          POSTGRES_USER: nexa_app
          POSTGRES_PASSWORD: phase3-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa_app -d nexa_billing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nexa_app:phase3-ci-only@127.0.0.1:5432/nexa_billing
      RADIUS_CREDENTIAL_ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - if: matrix.project == 'backend'
        run: node src/db/init.js
      - if: matrix.project == 'backend'
        run: node test/subscriberMigrationPolicy.test.js
      - if: matrix.project == 'backend'
        run: node test/subscriberMigrationRadius.test.js
      - if: matrix.project == 'backend'
        run: node test/subscriberMigrationWispman.test.js
      - if: matrix.project == 'backend'
        run: node test/subscriberMigrationSchema.integration.js
      - if: matrix.project == 'backend'
        run: node test/pppoeProvisioning.test.js
      - if: matrix.project == 'backend'
        run: node test/radiusDynamicAuth.test.js
      - if: matrix.project == 'backend'
        run: node test/pppoeLifecycle.integration.js
      - if: matrix.project == 'backend'
        run: node test/subscriberCommunications.test.js
      - if: matrix.project == 'backend'
        run: node test/hotspotTv.test.js
      - if: matrix.project == 'backend'
        run: node test/hotspotTvSchema.integration.js
      - if: matrix.project == 'backend'
        run: node test/phase2Auth.integration.js
      - if: matrix.project == 'frontend'
        run: npm run build

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for SBOM
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Generate CycloneDX SBOMs
        run: |
          npm sbom --prefix backend --sbom-format cyclonedx > backend.cdx.json
          npm sbom --prefix frontend --sbom-format cyclonedx > frontend.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-cyclonedx-sbom
          path: |
            backend.cdx.json
            frontend.cdx.json
          retention-days: 90

  dast:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Application security baseline
        run: bash ops/security/phase3/tests/dast-baseline.sh https://billing.polyizon.tech
      - name: OWASP ZAP passive baseline
        run: |
          docker run --rm --network host \
            -v "${PWD}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://billing.polyizon.tech/login -m 2 -I -r zap-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-zap-report
          path: zap-report.html
          retention-days: 90
