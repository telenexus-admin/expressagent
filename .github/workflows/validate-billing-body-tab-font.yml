name: Validate billing body tab font

on:
  push:
    branches:
      - agent/billing-body-tab-font
    paths:
      - .github/apply-billing-body-tab-font.py
      - .github/workflows/validate-billing-body-tab-font.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/billing-body-tab-font
          fetch-depth: 0

      - name: Apply billing typography change
        run: python3 .github/apply-billing-body-tab-font.py

      - name: Check diff formatting
        run: git diff --check

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified billing workspace
        run: |
          git config user.name "Telenexus Admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingWorkspace.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Use tab-title serif font across billing text"
            git push origin HEAD:agent/billing-body-tab-font
          fi
