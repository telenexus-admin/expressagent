name: Validate final billing font correction

on:
  push:
    branches:
      - agent/billing-heading-descendants
    paths:
      - .github/apply-billing-font-final.py
      - .github/workflows/validate-billing-font-final.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/billing-heading-descendants
          fetch-depth: 0
      - run: python3 .github/apply-billing-font-final.py
      - run: git diff --check
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: |
          git config user.name "Telenexus Admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingWorkspace.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Use tab font globally and serif for headings"
            git push origin HEAD:agent/billing-heading-descendants
          fi
