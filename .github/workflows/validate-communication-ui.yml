name: Validate communication UI redesign

on:
  push:
    branches:
      - agent/communication-ui-redesign
    paths:
      - frontend/src/pages/BillingCommunication.jsx
      - .github/workflows/validate-communication-ui.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/communication-ui-redesign
      - name: Check diff formatting
        run: git diff --check HEAD~1 HEAD || true
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
