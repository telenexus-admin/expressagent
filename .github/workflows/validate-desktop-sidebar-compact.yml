name: Validate compact desktop sidebar
on:
  push:
    branches: [agent/desktop-sidebar-compact]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'Compact desktop sidebar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-sidebar-compact
          fetch-depth: 0
      - name: Apply compact desktop sidebar
        run: python3 .github/apply-desktop-sidebar-compact.py
      - name: Verify source
        run: |
          grep -q "lg:w-\[218px\] lg:px-2.5 lg:py-3" frontend/src/pages/BillingWorkspace.jsx
          grep -q "lg:pl-\[218px\]" frontend/src/pages/BillingWorkspace.jsx
          ! grep -q "lg:py-2.5 lg:text-sm lg:font-bold" frontend/src/pages/BillingWorkspace.jsx
          ! grep -q "lg:mt-8 lg:space-y-5" frontend/src/pages/BillingWorkspace.jsx
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated sidebar
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingWorkspace.jsx
          git commit -m "Compact desktop sidebar"
          git push origin HEAD:agent/desktop-sidebar-compact
