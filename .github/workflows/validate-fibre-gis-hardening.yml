name: Validate Fibre GIS lifecycle hardening
on:
  push:
    branches: [agent/fibre-gis-v1]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'Harden Fibre GIS map lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fibre-gis-v1
          fetch-depth: 0
      - name: Apply hardening
        run: python3 .github/patch-fibre-gis-map-lifecycle.py
      - name: Verify source
        run: |
          grep -q "placementTypeRef.current" frontend/src/pages/BillingFibreGis.jsx
          ! grep -q "\[placementType, updateDraftSource\]" frontend/src/pages/BillingFibreGis.jsx
          node --check backend/src/services/fibreGis.js
          node --check backend/src/routes/noc.js
          git diff --check
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit hardened source
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingFibreGis.jsx
          git commit -m "Harden Fibre GIS map lifecycle"
          git push origin HEAD:agent/fibre-gis-v1
