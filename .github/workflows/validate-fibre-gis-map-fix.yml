name: Validate Fibre GIS map repair
on:
  push:
    branches: [agent/fibre-gis-map-fix]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'Fix Fibre GIS basemap loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fibre-gis-map-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
      - name: Apply Fibre GIS map repair
        run: python3 .github/apply-fibre-gis-map-fix.py
      - name: Verify backend runtime and syntax
        run: |
          node --check backend/src/routes/noc.js
          node -e "const {Readable}=require('stream'); if(typeof fetch!=='function') process.exit(2); if(typeof Readable.fromWeb!=='function') process.exit(3);"
          grep -q "router.get('/fibre-gis/map/\\*', proxyOpenFreeMap)" backend/src/routes/noc.js
          grep -q "OPENFREEMAP_ORIGIN" backend/src/routes/noc.js
      - name: Verify frontend map recovery
        run: |
          grep -q "MAP_STYLE = '/api/noc/fibre-gis/map/styles/liberty'" frontend/src/pages/BillingFibreGis.jsx
          grep -q "transformRequest: transformMapRequest" frontend/src/pages/BillingFibreGis.jsx
          grep -q "Map could not load" frontend/src/pages/BillingFibreGis.jsx
          grep -q "Retry map" frontend/src/pages/BillingFibreGis.jsx
          grep -q "disabled={mapState !== 'ready'}" frontend/src/pages/BillingFibreGis.jsx
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated repair
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add backend/src/routes/noc.js frontend/src/pages/BillingFibreGis.jsx
          git commit -m "Fix Fibre GIS basemap loading"
          git push origin HEAD:agent/fibre-gis-map-fix
