name: Validate Fibre GIS map and UI refinements

on:
  push:
    branches:
      - agent/fibre-gis-ui-map

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fibre-gis-ui-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply Fibre GIS UI and map fallback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gis = Path('frontend/src/pages/BillingFibreGis.jsx')
          text = gis.read_text()

          old = "const MAP_PROXY_PATH = '/api/noc/fibre-gis/map/';\n"
          new = "const MAP_PROXY_PATH = '/api/noc/fibre-gis/map/';\nconst MAP_FALLBACK_TILES = `${MAP_PROXY_PATH}natural_earth/ne2sr/{z}/{x}/{y}.png`;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = """      mapReadyRef.current = true;\n      clearTimeout(loadTimeout);\n      setMapState('ready');\n      setMapMessage('');\n      map.resize();\n      map.addSource('fibre-routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });\n"""
          new = """      mapReadyRef.current = true;\n      clearTimeout(loadTimeout);\n      setMapState('ready');\n      setMapMessage('');\n      map.resize();\n\n      // Keep a visible geographic base even if the vector worker/source is delayed.\n      // These OpenFreeMap Natural Earth tiles already travel through the authenticated\n      // same-origin proxy, so Fibre GIS never falls back to a blank white canvas.\n      if (!map.getSource('fibre-map-fallback')) {\n        map.addSource('fibre-map-fallback', {\n          type: 'raster',\n          tiles: [MAP_FALLBACK_TILES],\n          tileSize: 256,\n          maxzoom: 6,\n          attribution: 'OpenFreeMap © OpenMapTiles Data from OpenStreetMap',\n        });\n        const firstNonBackgroundLayer = (map.getStyle()?.layers || []).find((layer) => layer.type !== 'background')?.id;\n        map.addLayer({\n          id: 'fibre-map-fallback',\n          type: 'raster',\n          source: 'fibre-map-fallback',\n          paint: { 'raster-opacity': 0.88, 'raster-fade-duration': 0 },\n        }, firstNonBackgroundLayer);\n      }\n\n      map.addSource('fibre-routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  if (loading) return <div className=\"space-y-3\"><div className=\"h-24 animate-pulse rounded-[22px] bg-slate-200/70\" /><div className=\"h-[620px] animate-pulse rounded-[22px] bg-slate-200/70\" /></div>;\n\n  return <div className=\"space-y-3\">\n    <section className=\"relative overflow-hidden rounded-[22px] bg-[#071d13] px-4 py-4 text-white shadow-lg shadow-emerald-950/10 sm:px-5\"><div className=\"relative z-10 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between\"><div><div className=\"flex items-center gap-2\"><span className=\"inline-flex items-center gap-1.5 rounded-full bg-emerald-400/12 px-2 py-1 text-[8px] font-black uppercase tracking-[.15em] text-emerald-200 ring-1 ring-emerald-300/15\"><span className=\"h-1.5 w-1.5 rounded-full bg-emerald-400\" />Physical network</span><span className=\"text-[8px] font-semibold text-emerald-100/55\">MapLibre · GeoJSON</span></div><h2 className=\"mt-2 text-[22px] font-black tracking-[-.035em] sm:text-[25px]\">Fibre GIS</h2><p className=\"mt-0.5 max-w-2xl text-[10px] leading-4 text-emerald-100/70\">Map the real outside plant: POPs, OLTs, fibre routes, FDTs, FATs, splitters, poles, closures and customer sites.</p></div><div className=\"flex flex-wrap items-center gap-1.5\"><button type=\"button\" onClick={syncTopology} disabled={refreshing} className=\"inline-flex h-8 items-center gap-1.5 rounded-lg border border-white/12 bg-white/8 px-2.5 text-[8px] font-black text-white hover:bg-white/12 disabled:opacity-50\"><Icon name=\"sync\" className={`h-3.5 w-3.5 ${refreshing ? 'animate-spin' : ''}`} />Sync Topology</button><button type=\"button\" onClick={exportGeoJson} className=\"inline-flex h-8 items-center gap-1.5 rounded-lg border border-white/12 bg-white/8 px-2.5 text-[8px] font-black text-white hover:bg-white/12\"><Icon name=\"download\" className=\"h-3.5 w-3.5\" />GeoJSON</button><button type=\"button\" onClick={() => load({ quiet: true })} disabled={refreshing} className=\"flex h-8 w-8 items-center justify-center rounded-lg border border-white/12 bg-white/8 text-white hover:bg-white/12\"><Icon name=\"refresh\" className={`h-3.5 w-3.5 ${refreshing ? 'animate-spin' : ''}`} /></button></div></div><div className=\"pointer-events-none absolute -right-16 -top-20 h-48 w-48 rounded-full bg-emerald-400/10 blur-3xl\" /></section>\n\n"""
          new = """  if (loading) return <div className=\"-mx-3 -mt-3 min-h-screen bg-[#f7f8fb] px-3 pt-6 sm:-mx-8 sm:-mt-8 sm:px-8\"><div className=\"h-32 animate-pulse rounded-[22px] bg-slate-200/70\" /><div className=\"mt-4 h-[620px] animate-pulse rounded-[22px] bg-slate-200/70\" /></div>;\n\n  return <div className=\"-mx-3 -mt-3 min-h-screen bg-[#f7f8fb] pb-20 sm:-mx-8 sm:-mt-8\">\n    <section className=\"relative overflow-hidden billing-network-hero bg-[#0a2417] px-5 pb-14 pt-6 text-white sm:px-8\">\n      <div className=\"relative z-10 flex items-start justify-between gap-4\">\n        <div className=\"min-w-0\">\n          <p className=\"text-[9px] font-black uppercase tracking-[.2em] text-emerald-200\">Network / Fibre GIS</p>\n          <h2 className=\"mt-1.5 text-2xl font-black tracking-tight sm:text-3xl\">Fibre GIS</h2>\n          <p className=\"mt-1.5 max-w-2xl text-xs leading-5 text-emerald-100 sm:text-sm\">Map the real outside plant: POPs, OLTs, fibre routes, FDTs, FATs, splitters, poles, closures and customer sites.</p>\n        </div>\n        <div className=\"flex shrink-0 flex-wrap items-center justify-end gap-2\">\n          <button type=\"button\" onClick={syncTopology} disabled={refreshing} className=\"inline-flex h-10 items-center gap-2 rounded-xl border border-white/20 bg-white/10 px-3 text-[9px] font-black text-white transition hover:bg-white/20 disabled:opacity-50\"><Icon name=\"sync\" className={`h-4 w-4 ${refreshing ? 'animate-spin' : ''}`} />Sync Topology</button>\n          <button type=\"button\" onClick={exportGeoJson} className=\"inline-flex h-10 items-center gap-2 rounded-xl border border-white/20 bg-white/10 px-3 text-[9px] font-black text-white transition hover:bg-white/20\"><Icon name=\"download\" className=\"h-4 w-4\" />GeoJSON</button>\n          <button type=\"button\" onClick={() => load({ quiet: true })} disabled={refreshing} aria-label=\"Refresh Fibre GIS\" className=\"flex h-10 w-10 items-center justify-center rounded-xl border border-white/20 bg-white/10 text-white transition hover:bg-white/20 disabled:opacity-50\"><Icon name=\"refresh\" className={`h-4 w-4 ${refreshing ? 'animate-spin' : ''}`} /></button>\n        </div>\n      </div>\n      <div className=\"pointer-events-none absolute -bottom-1 left-0 right-0 h-9\"><svg viewBox=\"0 0 1200 180\" preserveAspectRatio=\"none\" className=\"h-full w-full\"><path d=\"M0 100 C210 30 330 178 520 112 C735 36 850 170 1040 70 C1110 34 1165 55 1200 32 L1200 180 L0 180 Z\" fill=\"#f7f8fb\" /></svg></div>\n    </section>\n\n    <div className=\"space-y-3 px-3 sm:px-8\">\n\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    {assetModal && <AssetModal initial={assetModal} assets={data.assets} routers={data.routers} saving={saving} onClose={() => setAssetModal(null)} onSave={saveAsset} />}\n    {routeModal && <RouteModal initial={routeModal} assets={data.assets} saving={saving} onClose={() => setRouteModal(null)} onSave={saveRoute} />}\n  </div>;\n}"""
          new = """    {assetModal && <AssetModal initial={assetModal} assets={data.assets} routers={data.routers} saving={saving} onClose={() => setAssetModal(null)} onSave={saveAsset} />}\n    {routeModal && <RouteModal initial={routeModal} assets={data.assets} saving={saving} onClose={() => setRouteModal(null)} onSave={saveRoute} />}\n    </div>\n  </div>;\n}"""
          assert old in text
          text = text.replace(old, new, 1)
          gis.write_text(text)

          workspace = Path('frontend/src/pages/BillingWorkspace.jsx')
          text = workspace.read_text()
          old = "text-left text-[9.5px] font-semibold tracking-[-.015em] transition sm:px-2.5 sm:py-1.5 sm:text-[10px] lg:px-2 lg:py-1 lg:text-[9.5px]"
          new = "text-left text-[12.35px] font-semibold tracking-[-.015em] transition sm:px-2.5 sm:py-1.5 sm:text-[13px] lg:px-2 lg:py-1 lg:text-[12.35px]"
          assert old in text
          text = text.replace(old, new, 1)
          workspace.write_text(text)
          PY
      - name: Verify source
        run: |
          grep -q "MAP_FALLBACK_TILES" frontend/src/pages/BillingFibreGis.jsx
          grep -q "fibre-map-fallback" frontend/src/pages/BillingFibreGis.jsx
          grep -q "billing-network-hero" frontend/src/pages/BillingFibreGis.jsx
          grep -q "text-\[12.35px\]" frontend/src/pages/BillingWorkspace.jsx
          grep -q "maplibre-gl-worker.mjs?worker&url" frontend/src/utils/maplibre.js
          git diff --check
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*worker*' -print -quit | grep .
      - name: Commit validated source
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingFibreGis.jsx frontend/src/pages/BillingWorkspace.jsx
          git commit -m "Refine Fibre GIS map and workspace UI"
          git push origin HEAD:agent/fibre-gis-ui-map
