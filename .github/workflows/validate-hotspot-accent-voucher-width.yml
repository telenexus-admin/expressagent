name: Validate hotspot accent voucher width

on:
  push:
    branches:
      - agent/hotspot-accent-voucher-width

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotspot-accent-voucher-width
          fetch-depth: 0

      - name: Apply exact hotspot fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/HotspotPortal.jsx')
          t = p.read_text()

          def rep(old, new, label):
              global t
              if old not in t:
                  raise SystemExit(f'{label} marker not found')
              t = t.replace(old, new, 1)

          rep("  const [voucherUser, setVoucherUser] = useState('');\n  const [voucherPassword, setVoucherPassword] = useState('');\n  const [passwordTouched, setPasswordTouched] = useState(false);",
              "  const [voucherCode, setVoucherCode] = useState('');",
              'voucher state')

          rep("  const updateVoucherUser = (value) => {\n    const next = value.toUpperCase();\n    setVoucherUser(next);\n    if (!passwordTouched) setVoucherPassword(next);\n  };",
              "  const updateVoucherCode = (value) => {\n    setVoucherCode(value.toUpperCase());\n  };",
              'voucher update helper')

          rep("    if (!voucherUser.trim()) {\n      setError('Enter your voucher username.');\n      return;\n    }\n    if (!voucherPassword.trim()) {\n      setError('Enter your voucher password.');\n      return;\n    }\n    if (voucherPassword.trim().toUpperCase() !== voucherUser.trim().toUpperCase()) {\n      setError('For this hotspot, the voucher username and password must be the same code.');\n      return;\n    }",
              "    if (!voucherCode.trim()) {\n      setError('Enter your voucher code.');\n      return;\n    }",
              'voucher validation')

          rep("          code: voucherUser.trim(),", "          code: voucherCode.trim(),", 'voucher payload')
          rep("          width: 60%;", "          width: 75%;", 'list width')

          rep('className={`hotspot-package-card hotspot-card-shadow grid w-full grid-cols-[105px_minmax(0,1fr)_auto] overflow-hidden rounded-[18px] border bg-white text-left transition hover:-translate-y-0.5 sm:grid-cols-[145px_minmax(0,1fr)_auto] ${\n                      selected ? \'border-blue-500 ring-2 ring-blue-100\' : \'border-slate-200\'\n                    }`}',
              'className={`hotspot-package-card hotspot-card-shadow grid w-full grid-cols-[105px_minmax(0,1fr)_auto] overflow-hidden rounded-[18px] border bg-white text-left transition hover:-translate-y-0.5 sm:grid-cols-[145px_minmax(0,1fr)_auto] ${\n                      selected ? \'ring-2\' : \'border-slate-200\'\n                    }`}\n                    style={selected ? { borderColor: accentColor, boxShadow: `0 0 0 2px ${accentColor}26, 0 12px 32px rgba(22,39,82,.13)` } : undefined}',
              'selected package accent')

          rep('className="flex items-center gap-2 px-3 text-[#0656d7] sm:gap-4 sm:px-6"',
              'className="flex items-center gap-2 px-3 sm:gap-4 sm:px-6" style={{ color: accentColor }}',
              'package price accent')
          rep('<Icon name="chevron" className="h-5 w-5 text-slate-600" />', '<Icon name="chevron" className="h-5 w-5" />', 'package chevron accent')

          rep('className="flex items-center gap-3 text-[#064ebd]"', 'className="flex items-center gap-3" style={{ color: accentColor }}', 'voucher heading accent')

          old_inputs = '''              <label className="relative block">
                <span className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[#3e6eca]">
                  <Icon name="user" className="h-6 w-6" />
                </span>
                <input
                  required
                  value={voucherUser}
                  onChange={(event) => updateVoucherUser(event.target.value)}
                  placeholder="Voucher Username"
                  autoComplete="username"
                  className="w-full rounded-xl border border-[#b9c9e7] bg-white py-4 pl-[52px] pr-4 font-mono text-sm font-bold uppercase tracking-wider outline-none transition placeholder:font-sans placeholder:font-medium placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
                />
              </label>

              <label className="relative block">
                <span className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[#3e6eca]">
                  <Icon name="lock" className="h-6 w-6" />
                </span>
                <input
                  required
                  type="password"
                  value={voucherPassword}
                  onChange={(event) => {
                    setPasswordTouched(true);
                    setVoucherPassword(event.target.value.toUpperCase());
                  }}
                  placeholder="Voucher Password"
                  autoComplete="current-password"
                  className="w-full rounded-xl border border-[#b9c9e7] bg-white py-4 pl-[52px] pr-4 font-mono text-sm font-bold uppercase tracking-wider outline-none transition placeholder:font-sans placeholder:font-medium placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
                />
              </label>'''
          new_inputs = '''              <label className="relative block">
                <span className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2" style={{ color: accentColor }}>
                  <Icon name="ticket" className="h-6 w-6" />
                </span>
                <input
                  required
                  type="text"
                  value={voucherCode}
                  onChange={(event) => updateVoucherCode(event.target.value)}
                  placeholder="Voucher Code"
                  autoComplete="one-time-code"
                  className="w-full rounded-xl border border-[#b9c9e7] bg-white py-4 pl-[52px] pr-4 font-mono text-sm font-bold uppercase tracking-wider outline-none transition placeholder:font-sans placeholder:font-medium placeholder:normal-case placeholder:tracking-normal placeholder:text-slate-400"
                  style={{ caretColor: accentColor }}
                />
              </label>'''
          rep(old_inputs, new_inputs, 'voucher fields')

          rep('className="w-full rounded-xl bg-gradient-to-r from-[#0876f9] to-[#073cc9] py-4 text-sm font-black uppercase tracking-wide text-white shadow-lg shadow-blue-700/20 disabled:opacity-60"',
              'className="w-full rounded-xl py-4 text-sm font-black uppercase tracking-wide text-white shadow-lg disabled:opacity-60" style={{ backgroundColor: accentColor, boxShadow: `0 10px 24px ${accentColor}2b` }}',
              'voucher login button accent')

          p.write_text(t)
          PY

      - name: Verify source
        run: |
          grep -q 'width: 75%' frontend/src/pages/HotspotPortal.jsx
          grep -q 'placeholder="Voucher Code"' frontend/src/pages/HotspotPortal.jsx
          ! grep -q 'Voucher Username' frontend/src/pages/HotspotPortal.jsx
          ! grep -q 'Voucher Password' frontend/src/pages/HotspotPortal.jsx
          grep -q 'backgroundColor: accentColor' frontend/src/pages/HotspotPortal.jsx
          git diff --check

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit validated source
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/HotspotPortal.jsx
          git commit -m "Refine hotspot package and voucher UI"
          git push origin HEAD:agent/hotspot-accent-voucher-width
