name: Validate hotspot bootstrap form fix

on:
  pull_request:
    branches:
      - production-sync-2026-08-04

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/hotspot-bootstrap-form-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotspot-bootstrap-form-fix
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/apply_hotspot_bootstrap_form.py

      - name: Syntax and safety assertions
        run: |
          node --check backend/src/services/hotspotEdgePortal.js
          node --check backend/src/routes/hotspotPortal.js
          grep -q 'id="portal-form"' backend/src/services/hotspotEdgePortal.js
          grep -q 'form.submit()' backend/src/services/hotspotEdgePortal.js
          grep -q 'name="server-address" value="$(server-address)"' backend/src/services/hotspotEdgePortal.js
          ! grep -q 'window.location.replace(target)' backend/src/services/hotspotEdgePortal.js
          grep -q 'function safeBootstrapRouterLogin' backend/src/routes/hotspotPortal.js
          grep -q "req.query\['server-address'\]" backend/src/routes/hotspotPortal.js
          git diff --check

      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/services/hotspotEdgePortal.js backend/src/routes/hotspotPortal.js
          git diff --cached --quiet && exit 0
          git commit -m "Use robust hotspot bootstrap form"
          git push origin HEAD:agent/hotspot-bootstrap-form-fix
