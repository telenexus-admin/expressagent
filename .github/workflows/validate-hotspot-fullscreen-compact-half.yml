name: Validate hotspot fullscreen compact half

on:
  push:
    branches:
      - agent/hotspot-fullscreen-compact-half

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotspot-fullscreen-compact-half
          fetch-depth: 0

      - name: Apply exact hotspot layout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/HotspotPortal.jsx')
          t = p.read_text()

          def rep(old, new, label):
              global t
              if old not in t:
                  raise SystemExit(f'{label} marker not found')
              t = t.replace(old, new, 1)

          rep("""  const pageStyle = backgroundImageUrl
    ? {
        ...heroStyle,
        backgroundRepeat: 'no-repeat',
        backgroundAttachment: 'scroll',
      }
    : {
        backgroundColor: theme.page,
      };

  const heroSectionStyle = backgroundImageUrl
    ? {
        background: 'transparent',
      }
    : heroStyle;
""",
"""  const mainStyle = backgroundImageUrl
    ? {
        ...heroStyle,
        backgroundRepeat: 'no-repeat',
        backgroundSize: 'cover',
        backgroundPosition: 'center center',
        backgroundAttachment: 'fixed',
      }
    : {
        backgroundColor: theme.page,
      };

  const pageStyle = backgroundImageUrl
    ? {
        background: 'transparent',
      }
    : {
        backgroundColor: theme.page,
      };

  const heroSectionStyle = backgroundImageUrl
    ? {
        background: 'transparent',
      }
    : heroStyle;
""",
          'background style block')

          rep("""    <main
      className=\"min-h-screen text-[#101938]\"
      style={{
        backgroundColor:
          theme.page,
      }}
    >
""",
"""    <main
      className=\"min-h-screen text-[#101938]\"
      style={mainStyle}
    >
""",
          'main wrapper')

          rep("""        .hotspot-green-template { background: #06180d !important; padding: 12px !important; }
""",
"""        .hotspot-green-template { background: ${backgroundImageUrl ? 'transparent' : '#06180d'} !important; padding: 8px !important; }
""",
          'green template background')

          rep("""        .hotspot-layout-compact {
          grid-template-columns:
            repeat(3, minmax(0, 1fr));

          gap:
            10px;
        }
""",
"""        .hotspot-layout-compact {
          grid-template-columns:
            repeat(3, minmax(0, 1fr));

          gap:
            6px;
        }

        .hotspot-layout-compact
        .hotspot-package-card {
          border-radius: 12px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:first-child {
          min-height: 44px !important;
          gap: 4px !important;
          padding: 6px 7px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:first-child
        svg {
          width: 18px !important;
          height: 18px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:first-child
        > div
        > div:first-child {
          font-size: 16px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:first-child
        > div
        > div:last-child {
          margin-top: 2px !important;
          font-size: 7px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:nth-child(2) {
          padding: 6px 8px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:nth-child(2)
        > div {
          font-size: 11px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:nth-child(2)
        p {
          display: none !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:last-child {
          gap: 3px !important;
          padding: 5px 8px 7px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:last-child
        span {
          font-size: 11px !important;
        }

        .hotspot-layout-compact
        .hotspot-package-card
        > div:last-child
        svg {
          width: 13px !important;
          height: 13px !important;
        }
""",
          'compact layout block')

          rep("""          className={designTemplate === 'green_portrait' ? 'hotspot-green-template relative overflow-hidden text-white' : 'hotspot-blue-grid relative overflow-hidden px-5 pb-28 pt-6 text-white sm:px-9 sm:pb-32 sm:pt-8'}
          style={designTemplate === 'green_portrait' ? undefined : heroSectionStyle}
""",
"""          className={designTemplate === 'green_portrait' ? 'hotspot-green-template relative overflow-hidden text-white' : 'hotspot-blue-grid relative overflow-hidden px-4 pb-20 pt-4 text-white sm:px-7 sm:pb-24 sm:pt-6'}
          style={backgroundImageUrl ? heroSectionStyle : (designTemplate === 'green_portrait' ? undefined : heroSectionStyle)}
""",
          'hero section')

          rep("""            className=\"relative z-20 px-5 pt-4 sm:px-9\"
""",
"""            className=\"relative z-20 px-3 pt-2 sm:px-6\"
""",
          'campaign spacing')

          rep("""            className={`relative z-20 px-5 sm:px-9 ${
""",
"""            className={`relative z-20 px-3 sm:px-6 ${
""",
          'flash spacing')

          rep("""        <section ref={packagesRef} className={`${flashOffer ? 'pt-8' : 'pt-10'} px-5 sm:px-9`}>
""",
"""        <section ref={packagesRef} className={`${flashOffer ? 'pt-4' : 'pt-5'} px-3 sm:px-6`}>
""",
          'packages spacing')

          rep("""              className={`mt-5 hotspot-packages hotspot-layout-${packageLayout}`}
""",
"""              className={`mt-3 hotspot-packages hotspot-layout-${packageLayout}`}
""",
          'packages grid margin')

          rep("""        <section ref={voucherRef} className=\"px-5 pb-7 pt-7 sm:px-9\">
""",
"""        <section ref={voucherRef} className=\"px-3 pb-4 pt-4 sm:px-6\">
""",
          'voucher spacing')

          rep("""            } px-5 py-5 text-white sm:px-9`}
""",
"""            } px-3 py-4 text-white sm:px-6`}
""",
          'footer spacing')

          p.write_text(t)
          PY

      - name: Verify exact source changes
        run: |
          grep -q 'style={mainStyle}' frontend/src/pages/HotspotPortal.jsx
          grep -q "background: \${backgroundImageUrl ? 'transparent' : '#06180d'}" frontend/src/pages/HotspotPortal.jsx
          grep -q 'min-height: 44px !important' frontend/src/pages/HotspotPortal.jsx
          grep -q 'display: none !important' frontend/src/pages/HotspotPortal.jsx
          grep -q "className={`mt-3 hotspot-packages" frontend/src/pages/HotspotPortal.jsx
          git diff --check

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit validated source
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/HotspotPortal.jsx
          git commit -m "Compact hotspot cards and extend background"
          git push origin HEAD:agent/hotspot-fullscreen-compact-half
