name: Validate compact mobile sidebar

on:
  push:
    branches:
      - agent/mobile-sidebar-compact
    paths:
      - .github/apply-mobile-sidebar-compact.py
      - .github/workflows/validate-mobile-sidebar-compact.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-sidebar-compact
          fetch-depth: 0

      - name: Apply exact mobile sidebar changes
        run: python3 .github/apply-mobile-sidebar-compact.py

      - name: Check diff formatting
        run: git diff --check

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified billing workspace
        run: |
          git config user.name "Telenexus Admin"
          git config user.email "admin@telenexustechnologies.com"
          git add frontend/src/pages/BillingWorkspace.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Compact mobile billing sidebar"
            git push origin HEAD:agent/mobile-sidebar-compact
          fi
