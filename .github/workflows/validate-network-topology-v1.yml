name: Validate network topology v1
on:
  push:
    branches: [agent/network-topology-v1]
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'Wire live network topology workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-topology-v1
          fetch-depth: 0
      - name: Apply wiring
        run: python3 .github/apply-network-topology-v1.py
      - name: Install visual libraries
        working-directory: frontend
        run: npm install @xyflow/react elkjs maplibre-gl --save
      - name: Verify backend syntax
        run: |
          node --check backend/src/services/topology.js
          node --check backend/src/routes/noc.js
      - name: Verify source
        run: |
          grep -q "@xyflow/react" frontend/src/pages/BillingTopology.jsx
          grep -q "elkjs/lib/elk.bundled.js" frontend/src/pages/BillingTopology.jsx
          grep -q "maplibre-gl" frontend/src/pages/BillingTopology.jsx
          grep -q "'/ip/neighbor/print'" backend/src/services/topology.js
          grep -q "router.get('/topology'" backend/src/routes/noc.js
          grep -q "\['topology', 'Topology', 'topology'\]" frontend/src/pages/BillingWorkspace.jsx
          git diff --check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated wiring
        run: |
          git config user.name "telenexus-admin"
          git config user.email "admin@telenexustechnologies.com"
          git add backend/src/services/topology.js backend/src/routes/noc.js frontend/src/pages/BillingWorkspace.jsx frontend/package.json frontend/package-lock.json
          git commit -m "Wire live network topology workspace"
          git push origin HEAD:agent/network-topology-v1
