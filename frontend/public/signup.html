<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Create account | Polyizon Billing</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');*{box-sizing:border-box}body{margin:0;background:#080b0c;color:#fff;font-family:'DM Sans',Arial,sans-serif;min-height:100vh}.orb{position:fixed;width:480px;height:480px;right:-180px;top:-180px;border-radius:50%;background:#70d6ab18;filter:blur(70px)}main{position:relative;max-width:570px;margin:auto;padding:38px 20px 58px}.back{color:#c6cbc8;text-decoration:none;font-size:14px;font-weight:600}.card{margin-top:28px;padding:34px;border:1px solid #ffffff17;border-radius:30px;background:#1c2419e8;box-shadow:0 30px 80px #0008}.eyebrow{margin:0;color:#bff2d7;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:12px 0 0;font-size:40px;line-height:1.02;font-weight:400;font-family:'Instrument Serif',Georgia,serif}p{color:#c4cbc6;font-size:14px;line-height:1.65}.google,.submit{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;border-radius:13px;padding:14px;border:1px solid #ffffff22;font:700 14px 'DM Sans';cursor:pointer}.google{background:#fff;color:#172117;margin-top:23px}.divider{display:flex;gap:12px;align-items:center;margin:22px 0;color:#95a198;font-size:12px}.divider:before,.divider:after{content:'';height:1px;flex:1;background:#ffffff17}form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{display:block;color:#e1e6e1;font-size:13px;font-weight:500}input{display:block;width:100%;margin-top:8px;border:1px solid #ffffff20;border-radius:12px;background:#00000025;color:white;padding:13px;font:14px 'DM Sans';outline:none}input:focus{border-color:#d9eee1}input:disabled{opacity:.65}.hint{margin:-7px 0 0;font-size:11px;color:#96a098}.consent{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;color:#c4cbc6}.consent input{display:inline-block;width:auto;margin:3px 0 0}.submit{grid-column:1/-1;background:#f5f1e8;border:0;color:#23291e;margin-top:4px}.submit:disabled{opacity:.6}.error,.success{display:none;margin:18px 0 0;border-radius:12px;padding:12px 14px;font-size:13px}.error{background:#4c161dcc;color:#ffe0e2;border:1px solid #fa9ba688}.success{background:#16452fcc;color:#d9ffe7;border:1px solid #9dd4ae66}.login{text-align:center;font-size:13px}.login a{color:white}@media(max-width:520px){.card{padding:26px 20px}h1{font-size:36px}form{grid-template-columns:1fr}.full,.submit{grid-column:auto}}</style></head><body><div class="orb"></div><main><a class="back" href="https://www.polyizon.tech/">← Back to Polyizon</a><section class="card" id="card"><p class="eyebrow">Polyizon Billing</p><h1>Create your ISP account.</h1><p>Start your 14-day Starter trial. No card required.</p><div class="error" id="error" role="alert"></div><button class="google" id="google" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.51h3.14c1.84-1.69 2.91-4.19 2.91-7.28Z"/><path fill="#34A853" d="M12 21.75c2.62 0 4.82-.87 6.44-2.36L15.3 16.9c-.87.58-1.98.93-3.3.93-2.54 0-4.7-1.71-5.47-4.01H3.29v2.59A9.73 9.73 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.53 13.82A5.86 5.86 0 0 1 6.22 12c0-.63.11-1.23.31-1.82V7.59H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.04 4.41l3.24-2.59Z"/><path fill="#EA4335" d="M12 6.17c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.24 14.62 2.25 12 2.25a9.73 9.73 0 0 0-8.71 5.34l3.24 2.59c.77-2.3 2.93-4.01 5.47-4.01Z"/></svg>Continue with Google</button><div class="divider">or create with email</div><form id="signup"><label class="full">ISP / business name<input required name="isp_name" autocomplete="organization" placeholder="e.g. Horizon Fibre"></label><label class="full">Your full name<input required name="owner_name" autocomplete="name" placeholder="Business owner or manager"></label><label>Business email<input required name="email" type="email" autocomplete="email" placeholder="you@business.com"></label><label>Phone number<input required name="phone" type="tel" autocomplete="tel" placeholder="+254 700 000 000"></label><label class="password">Create password<input required name="password" type="password" minlength="12" autocomplete="new-password" placeholder="12+ characters"></label><label class="password">Confirm password<input required name="confirm_password" type="password" minlength="12" autocomplete="new-password" placeholder="Repeat password"></label><p class="hint full password">Use 12+ characters and at least three of: uppercase, lowercase, number, symbol.</p><label class="full consent"><input required type="checkbox" name="welcome_call_consent" value="yes"> <span>I agree that Polyizon may place an automated welcome call to this number after my account is created.</span></label><button class="submit" type="submit">Create my billing account</button></form><p class="login">Already have an account? <a href="/login">Sign in</a></p></section></main><script>const form=document.getElementById('signup'),error=document.getElementById('error'),google=document.getElementById('google');let googleToken='';function showError(message){error.textContent=message;error.style.display='block'}function payload(token){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return null}}const params=new URLSearchParams(location.hash.slice(1));if(params.get('google_signup_token')){const p=payload(params.get('google_signup_token'));if(p&&p.email){googleToken=params.get('google_signup_token');form.email.value=p.email;form.owner_name.value=p.name||'';form.email.readOnly=true;document.querySelectorAll('.password').forEach(e=>e.style.display='none');google.textContent='Google email verified';google.disabled=true;history.replaceState({},'',location.pathname)}else showError('Your Google verification expired. Please continue with Google again.')}google.addEventListener('click',()=>location.href='/api/auth/google/start?return_to='+encodeURIComponent(location.origin)+'&mode=signup');form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';const data=Object.fromEntries(new FormData(form));if(!googleToken&&data.password!==data.confirm_password)return showError('Your passwords do not match.');const button=form.querySelector('.submit');button.disabled=true;button.textContent='Creating your workspace…';try{const response=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,...(googleToken?{google_signup_token:googleToken}:{})})});const result=await response.json();if(!response.ok)throw new Error(result.error||result.errors?.[0]?.msg||'We could not create your account.');document.getElementById('card').innerHTML='<p class="eyebrow">Account created</p><h1>Your Polyizon Billing trial is ready.</h1><p>We sent the account details to your email. Sign in to set up multi-factor authentication and start your 14-day Starter trial.</p><a class="submit" style="text-decoration:none" href="'+(googleToken?'/api/auth/google/start?return_to='+encodeURIComponent(location.origin):'/login')+'">'+(googleToken?'Continue with Google':'Sign in to Polyizon Billing')+'</a>'}catch(err){showError(err.message)}finally{button.disabled=false;button.textContent='Create my billing account'}});</script></body></html>
