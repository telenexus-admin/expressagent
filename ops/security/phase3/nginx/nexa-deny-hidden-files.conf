# Include inside each public Nexa server block.
# ACME remains available while dotfiles and common source/config files never reach the SPA fallback.
location ~ ^/(?!\.well-known(?:/|$))\. {
    return 404;
}

location ~* ^/(?:package(?:-lock)?\.json|server\.js|docker-compose(?:\.[^/]*)?\.ya?ml)$ {
    return 404;
}