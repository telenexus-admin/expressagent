; Confirmed forwarding provider source, restricted to this exact address.
; Included by pjsip.conf and routed through the existing from-cloudone context.
[forwarding-endpoint]
type=endpoint
transport=nexa-cloudone-udp
context=from-cloudone
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
contact_user=254207913950
send_pai=no
trust_id_inbound=no

[forwarding-identify]
type=identify
endpoint=forwarding-endpoint
match=149.50.107.52/32

; Dedicated Vapi assistant route for inbound CloudOne DID 0207913951.
; This assistant-specific URI does not use Asterisk outbound digest auth.
[vapi-951-endpoint]
type=endpoint
transport=nexa-cloudone-udp
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=vapi-951-aor

[vapi-951-aor]
type=aor
contact=sip:159d05a6-196a-4c7b-99ce-cfb92594cbbd.sip.vapi.ai:5060
