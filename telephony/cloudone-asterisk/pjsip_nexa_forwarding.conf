; Confirmed forwarding provider source, restricted to this exact address.
; Included by pjsip.conf and routed through the existing from-cloudone context.
[forwarding-endpoint]
type=endpoint
transport=nexa-cloudone-udp
context=from-cloudone
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
contact_user=254207913950
send_pai=no
trust_id_inbound=no

[forwarding-identify]
type=identify
endpoint=forwarding-endpoint
match=149.50.107.52/32